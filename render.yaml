# Blueprint do Render do backend do fdsFlix.
# No Render: New → Blueprint → conecte o repositório. Ele lê este arquivo.
#
# As chaves com sync: false são pedidas no momento do deploy.
# O restante já vai pronto. A URL pública do serviço é detectada pelo
# RENDER_EXTERNAL_URL, então não precisa preencher PUBLIC_BASE_URL.

services:
  - type: web
    name: fdsflix
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TMDB_API_KEY
        sync: false
      - key: VIDLINK_KEY_HEX
        sync: false
      - key: VIDLINK_API_URL
        value: https://vidlink.pro/api/b
      # Proxy de HTML do player (AdShield na Vercel). Opcional: sem ele, o embed
      # VidLink continua indo direto. Não é VM e não é usado para o vídeo.
      - key: ADSHIELD_BASE_URL
        sync: false
      # Vidsrc direto, sem iframe e sem anúncio, extraído e entregue pelo adproxy na
      # Vercel (o Render só devolve ~1 KB de JSON). Para VOLTAR ao fluxo anterior:
      # apague esta variável e faça redeploy. Ver adproxy/VERCEL.md.
      - key: VIDSRC_PROXY_URL
        sync: false
      # Várias Vercels (uma por conta) somam a cota de banda. Separadas por vírgula.
      # Tem prioridade junto com a acima; ver docs/VERCEL-POOL.md.
      - key: VIDSRC_PROXY_URLS
        sync: false
      - key: VERCEL_QUOTA_GB
        value: "100"
      # Opcional, adicione à mão em Environment (de propósito não está declarada aqui, para o
      # Blueprint não pedir valor): VIDSRC_PROXY_QUOTAS = cota por provedor que NÃO é Vercel
      # (Wasmer etc.), `URL=GB` separados por vírgula. A URL também vai em VIDSRC_PROXY_URLS.
      # Vazio = nada muda. Ver docs/VERCEL-POOL.md.
      # Dia do mês em que a cota da Vercel renova (veja em Usage no painel dela).
      - key: USAGE_RESET_DAY
        value: "1"
      # Acessos por IP (painel /visitors.html), adicione à mão em Environment: STATS_KEY = senha de leitura
      # (sem ela o painel fica desligado). Tabela: supabase/visitors-schema.sql. Ver docs/VISITANTES.md.
      # Worker repassador da Cloudflare (deploy/cloudflare-worker). Opcional: sem as duas, vai direto.
      - key: VIDEO_RELAY_URL
        sync: false
      - key: VIDEO_RELAY_KEY
        sync: false
      # Render Free tem só 0.1 CPU: 360p + 1 sessão é o que dá para tentar.
      # Se subir para Starter/Standard, aumente para 480/720.
      - key: MAX_TRANSCODE_HEIGHT
        value: "360"
      - key: MAX_SESSIONS
        value: "1"
