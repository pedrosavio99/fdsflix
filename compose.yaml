services:
  fdsflix:
    build: .
    container_name: fdsflix
    restart: unless-stopped
    env_file:
      - .env
    # Só o Caddy (no host) acessa a porta 3000; ela não fica exposta na internet.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
